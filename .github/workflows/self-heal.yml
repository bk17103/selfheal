name: Self-Healing Pipeline Fix

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: main  # Ensure the workflow starts from the default branch

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install snowflake-connector-python

      - name: Fetch OpenAI fix from Snowflake
        run: python scripts/fetch_openai_fix.py

      - name: Commit fix and create branch
        run: |
          git config --global user.name "bk17103"
          git config --global user.email "barkul.kumar@gmail.com"
          git fetch origin
          git checkout -B fix/openai-recommendation origin/fix/openai-recommendation || git checkout -b fix/openai-recommendation
          git pull origin fix/openai-recommendation || echo "No remote changes to pull"
          git add sql/openai_fix.sql
          git commit -m "Self-healing: Apply OpenAI fix for pipeline error" || echo "No changes to commit"
          git push origin fix/openai-recommendation --force-with-lease

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: fix/openai-recommendation
          base: main  # Ensure the PR is created against the main branch
          title: "OpenAI-suggested fix for pipeline error"
          body: "This PR contains a fix generated via OpenAI based on a Snowflake error."
